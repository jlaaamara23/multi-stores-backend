spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false

# Product images must be stored in Cloudinary, never on the server's disk
# (Railway's filesystem is wiped on every deploy). Uploads fail if Cloudinary is not configured.
app.storage.require-cloudinary=true

# SSL is applied in RenderDatabaseEnvironmentPostProcessor:
# - Render / public hosts: sslmode=require
# - Railway private network (*.railway.internal): sslmode=disable
